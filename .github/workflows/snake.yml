# Redraws the contribution-graph snake once a day and publishes the SVGs to the "output" branch.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0f5b78&color_dots=#ebedf0,#c3e0eb,#7fbfd8,#3d93b5,#0f5b78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5fd0f0&color_dots=#161b22,#0e3a4a,#16627d,#2b8db0,#5fd0f0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
